name: Aplicar tomada manual do C.A. Atende

on:
  push:
    branches: [fix/ca-atende-manual-takeover]
    paths:
      - '.github/scripts/apply-manual-takeover.py'
      - '.github/workflows/apply-manual-takeover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: fix/ca-atende-manual-takeover
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar correção focada
        run: python3 .github/scripts/apply-manual-takeover.py
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Build de produção
        run: npm run build
      - name: Testes automatizados
        run: npm test
      - name: Teste de carga
        run: npm run test:load
      - name: Gravar somente após validação
        run: |
          rm .github/scripts/apply-manual-takeover.py .github/workflows/apply-manual-takeover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/evolution-whatsapp.ts tests/evolution-human-takeover-contract.test.mjs .github/scripts/apply-manual-takeover.py .github/workflows/apply-manual-takeover.yml
          git commit -m 'C.A. Atende respeita atendimento manual no WhatsApp'
          git push origin HEAD:fix/ca-atende-manual-takeover

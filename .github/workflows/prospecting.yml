name: Validar Prospecção
on:
  pull_request:
    paths: ['prospeccao/**', '.github/workflows/prospecting.yml']
  push:
    branches: [feat/ca-prospeccao-google-places-base]
permissions:
  contents: read
jobs:
  prospecting:
    name: Prospecção PostgreSQL e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prospecting_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: prospeccao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
      - name: Resolver lockfile e instalar dependências
        run: npm install --package-lock-only --ignore-scripts && npm ci
      - name: Testes unitários e integração com PostgreSQL isolado
        env:
          PROSPECCAO_TEST_DATABASE_URL: postgres://test:test@localhost:5432/prospecting_test
        run: npm test
      - name: Build de produção
        run: npm run build

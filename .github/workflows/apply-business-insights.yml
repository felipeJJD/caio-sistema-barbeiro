name: Aplicar insights no painel

on:
  push:
    branches:
      - feat/client-pulse-finance-charts

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/client-pulse-finance-charts
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar componentes
        run: node scripts/apply-business-insights.mjs
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      - name: Salvar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/dashboard-app.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrar clientes parados e gráficos financeiros"
          git push origin HEAD:feat/client-pulse-finance-charts

name: Aplicar automação completa do C.A. Atende

on:
  push:
    branches:
      - fix/ca-atende-full-automation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ca-atende-full-automation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar alterações seguras
        run: python3 scripts/apply-ca-atende-full-automation.py
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Validar build de produção
        run: npm run build
      - name: Rodar testes automatizados
        run: npm test
      - name: Teste de carga local
        run: npm run test:load
      - name: Publicar somente alterações validadas
        shell: bash
        run: |
          rm -f .github/workflows/apply-ca-atende-full-automation.yml scripts/apply-ca-atende-full-automation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C.A. Atende automatiza gestão completa de horários"
          git push origin HEAD:fix/ca-atende-full-automation

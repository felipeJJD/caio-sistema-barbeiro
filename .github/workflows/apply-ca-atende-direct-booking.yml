name: Aplicar agendamento direto do C.A. Atende

on:
  push:
    branches:
      - fix/ca-atende-direct-booking-v4

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Repete correção direta do C.A. Atende'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Tornar o contrato do evento inbound específico
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-ca-atende-direct-booking.py')
          text = p.read_text()
          old = '''replace_once(
              "db/whatsapp.ts",
              '  phone: string;\\n  text: string;\\n',
              '  phone: string;\\n  senderName?: string;\\n  text: string;\\n',
          )'''
          new = '''replace_once(
              "db/whatsapp.ts",
              'export type WhatsappInboundTextEvent = {\\n  organizationId: number;\\n  messageRowId: number;\\n  providerMessageId: string;\\n  phone: string;\\n  text: string;\\n',
              'export type WhatsappInboundTextEvent = {\\n  organizationId: number;\\n  messageRowId: number;\\n  providerMessageId: string;\\n  phone: string;\\n  senderName?: string;\\n  text: string;\\n',
          )'''
          if text.count(old) != 1:
              raise SystemExit('Não encontrei exatamente o contrato antigo do evento inbound.')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Aplicar alterações com contratos exatos
        run: python3 scripts/apply-ca-atende-direct-booking.py
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Validar build de produção
        run: npm run build
      - name: Rodar testes automatizados
        run: npm test
      - name: Teste de carga local
        run: npm run test:load
      - name: Publicar somente alterações validadas
        shell: bash
        run: |
          rm scripts/apply-ca-atende-direct-booking.py
          rm .github/workflows/apply-ca-atende-direct-booking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C.A. Atende conclui agendamentos no WhatsApp"
          git push origin HEAD:fix/ca-atende-direct-booking-v4

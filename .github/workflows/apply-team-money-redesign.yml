name: Aplicar redesenho vales

on:
  push:
    branches: [feat/team-money-redesign]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar branch
        uses: actions/checkout@v5
        with:
          ref: feat/team-money-redesign
      - name: Preparar Node 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar alterações protegidas
        run: node scripts/apply-team-money-redesign.mjs
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Rodar testes
        run: npm test
      - name: Validar build
        run: npm run build
      - name: Salvar alterações na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/team-money.ts app/ui/team-money-section.tsx app/ui/dashboard-app.tsx app/globals.css tests/team-money-redesign-contract.test.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Redesenhar vales e saldos da equipe"
          git push origin HEAD:feat/team-money-redesign

name: Aplicar upgrade Agenda CA
on:
  push:
    branches: [feat/agenda-ca-context]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agenda-ca-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar mudanças focadas
        run: node scripts/apply-agenda-ca-upgrade.mjs
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      - name: Carga
        run: npm run test:load
      - name: Limpar aplicador temporário
        run: rm -f scripts/apply-agenda-ca-upgrade.mjs .github/workflows/apply-agenda-ca-upgrade.yml
      - name: Gravar resultado validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Melhora Agenda e contexto do C.A. Atende"
          git push origin feat/agenda-ca-context

name: Ajustar lint vales

on:
  push:
    branches: [feat/team-money-redesign]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/team-money-redesign
      - name: Remover estado derivado dentro do effect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/ui/team-money-section.tsx')
          s = p.read_text()
          old = '''  useEffect(() => {\n    if (!owner || !rows.length) return;\n    if (selectedMemberId === null || !rows.some((row) => row.teamMemberId === selectedMemberId)) {\n      setSelectedMemberId(rows[0].teamMemberId);\n    }\n  }, [owner, rows, selectedMemberId]);\n\n'''
          if old not in s:
              raise SystemExit('effect alvo não encontrado')
          p.write_text(s.replace(old, '', 1))
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      - name: Salvar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/team-money-section.tsx
          git commit -m "Evitar estado derivado no effect de vales"
          git push origin HEAD:feat/team-money-redesign

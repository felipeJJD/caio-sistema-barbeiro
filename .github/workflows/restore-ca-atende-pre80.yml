name: Restaurar C.A. Atende anterior ao PR 80

on:
  push:
    branches: [revert/ca-atende-pre80]
    paths:
      - '.github/workflows/restore-ca-atende-pre80.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: revert/ca-atende-pre80
          fetch-depth: 0
      - name: Restaurar somente o comportamento anterior do C.A. Atende
        run: |
          git checkout fefbaec6529d9b696317f3d6e75a2b5b33ec3508 -- \
            db/ca-atende.ts \
            tests/ca-atende-conversations.test.mjs \
            tests/ca-atende-master-scenarios.test.mjs \
            tests/ca-atende.test.mjs
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Build de produção
        run: npm run build
      - name: Testes automatizados
        run: npm test
      - name: Teste de carga
        run: npm run test:load
      - name: Gravar somente após validação
        run: |
          rm .github/workflows/restore-ca-atende-pre80.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/ca-atende.ts tests/ca-atende-conversations.test.mjs tests/ca-atende-master-scenarios.test.mjs tests/ca-atende.test.mjs .github/workflows/restore-ca-atende-pre80.yml
          git commit -m 'Restaura comportamento anterior do C.A. Atende'
          git push origin HEAD:revert/ca-atende-pre80

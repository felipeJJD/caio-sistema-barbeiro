name: Trial days branch patch

on:
  push:
    branches:
      - feat/trial-days-configuravel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trial-days-configuravel
          fetch-depth: 0
      - name: Apply exact source changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(path, before, after, expectedCount = 1) {
            let text = fs.readFileSync(path, 'utf8');
            const count = text.split(before).length - 1;
            if (count !== expectedCount) throw new Error(`${path}: expected ${expectedCount} occurrence(s), found ${count}: ${before.slice(0, 100)}`);
            text = text.split(before).join(after);
            fs.writeFileSync(path, text);
          }

          replaceExact(
            'db/auth.ts',
            'import { attachOrganizationReferral } from "./affiliates";',
            'import { attachOrganizationReferral } from "./affiliates";\nimport { getPlatformTrialDays } from "./platform-trial";',
          );
          replaceExact(
            'db/auth.ts',
            'const trialDays = latestVerification?.trialDays ?? 14;',
            'const trialDays = latestVerification?.trialDays ?? await getPlatformTrialDays();',
          );
          replaceExact(
            'db/auth.ts',
            '    trialDays: 14,',
            '    trialDays: await getPlatformTrialDays(),',
            2,
          );
          replaceExact(
            'db/auth.ts',
            'const trialDays = Math.round(Number(input.trialDays ?? 14));',
            'const trialDays = Math.round(Number(input.trialDays ?? await getPlatformTrialDays()));',
          );

          replaceExact(
            'app/api/platform/invites/route.ts',
            '} from "../../../../db/auth";',
            '} from "../../../../db/auth";\nimport { getPlatformTrialDays } from "../../../../db/platform-trial";',
          );
          replaceExact(
            'app/api/platform/invites/route.ts',
            '      await restartBarbershopTrial(access, Number(data.organizationId), 14);',
            '      await restartBarbershopTrial(access, Number(data.organizationId), await getPlatformTrialDays());',
          );

          replaceExact(
            'app/ui/dashboard-app.tsx',
            'import { TeamMoneySection } from "./team-money-section";',
            'import { TeamMoneySection } from "./team-money-section";\nimport { PlatformTrialSettings } from "./platform-trial-settings";',
          );
          replaceExact(
            'app/ui/dashboard-app.tsx',
            'text: "Crie sua barbearia e teste o Cortou Anotou por 14 dias."',
            'text: "Crie sua barbearia e teste o Cortou Anotou grátis."',
          );
          replaceExact(
            'app/ui/dashboard-app.tsx',
            'Reabrir o teste de ${shop.name} por mais 14 dias?',
            'Reabrir o teste de ${shop.name} pelo período gratuito configurado?',
          );
          replaceExact(
            'app/ui/dashboard-app.tsx',
            'O teste de ${shop.name} foi reaberto por 14 dias.',
            'O teste de ${shop.name} foi reaberto pelo período gratuito configurado.',
          );
          replaceExact(
            'app/ui/dashboard-app.tsx',
            'Cada proprietário cria sozinho sua conta, recebe 14 dias grátis e entra no próprio espaço.',
            'Cada proprietário cria sozinho sua conta, recebe o período grátis configurado e entra no próprio espaço.',
          );
          replaceExact(
            'app/ui/dashboard-app.tsx',
            'Reabrir teste · 14 dias',
            'Reabrir teste',
          );
          replaceExact(
            'app/ui/dashboard-app.tsx',
            '        {pricingFeedback && <p className={pricingFeedback.includes("atualizado") ? "success" : "error"} role="status">{pricingFeedback}</p>}\n      </form>\n    </section>\n    </>}',
            '        {pricingFeedback && <p className={pricingFeedback.includes("atualizado") ? "success" : "error"} role="status">{pricingFeedback}</p>}\n      </form>\n    </section>\n    <PlatformTrialSettings />\n    </>}',
          );

          fs.unlinkSync('.github/workflows/trial-days-branch-patch.yml');
          NODE
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/auth.ts app/api/platform/invites/route.ts app/ui/dashboard-app.tsx .github/workflows/trial-days-branch-patch.yml
          git commit -m "Integrar dias de teste configuráveis ao cadastro e painel"
          git push origin HEAD:feat/trial-days-configuravel

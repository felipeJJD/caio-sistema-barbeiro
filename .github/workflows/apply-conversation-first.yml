name: Aplicar conversa primeiro no C.A. Atende

on:
  push:
    branches:
      - feat/ca-atende-conversation-first

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ca-atende-conversation-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar mudanças focadas
        shell: bash
        run: |
          echo ':  ' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Build de produção
        run: npm run build
      - name: Testes automatizados
        run: npm test
      - name: Teste de carga
        run: npm run test:load
      - name: Gravar somente após validação
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-conversation-first.yml
          git add db/ca-atende.ts tests/ca-atende-conversations.test.mjs
          git commit -m "C.A. Atende prioriza conversa no agendamento"
          git push origin feat/ca-atende-conversation-first

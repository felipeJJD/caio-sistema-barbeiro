name: Validar C.A. Prospecção

on:
  pull_request:
    branches:
      - feat/ca-prospeccao-google-places-base
    paths:
      - "prospeccao/**"
      - ".github/workflows/prospeccao-validate.yml"

permissions:
  contents: read

jobs:
  prospeccao:
    name: Testes e build da Prospecção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Preparar Node 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
      - name: Isolar app da Prospecção
        run: |
          mkdir -p "$RUNNER_TEMP/ca-prospeccao"
          cp -R prospeccao/. "$RUNNER_TEMP/ca-prospeccao/"
      - name: Instalar dependências
        run: cd "$RUNNER_TEMP/ca-prospeccao" && npm install --no-audit --no-fund
      - name: Rodar testes automatizados
        run: cd "$RUNNER_TEMP/ca-prospeccao" && npm test
      - name: Validar build de produção
        run: cd "$RUNNER_TEMP/ca-prospeccao" && npm run build

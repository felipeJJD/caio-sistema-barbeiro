name: Aplicar correções equipe e WhatsApp

on:
  push:
    branches:
      - fix/employee-agenda-whatsapp-handoff

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: fix/employee-agenda-whatsapp-handoff
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar correções focadas
        run: python3 scripts/apply-employee-agenda-whatsapp-handoff.py
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      - name: Carga
        run: npm run test:load
      - name: Remover aplicadores temporários
        run: rm -f scripts/apply-employee-agenda-whatsapp-handoff.py .github/workflows/apply-employee-agenda-whatsapp-handoff.yml
      - name: Publicar resultado validado na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige confirmação e remarcação da equipe no WhatsApp"
          git push origin fix/employee-agenda-whatsapp-handoff

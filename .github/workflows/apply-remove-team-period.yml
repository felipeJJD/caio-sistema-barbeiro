name: Aplicar limpeza do fim do painel

on:
  push:
    branches:
      - fix/remove-team-period-dashboard

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/remove-team-period-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Aplicar ajuste
        run: node scripts/remove-team-period-dashboard.mjs
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      - name: Salvar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/dashboard-app.tsx
          git commit -m "Remover ranking antigo da equipe do painel"
          git push origin HEAD:fix/remove-team-period-dashboard

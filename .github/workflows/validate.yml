name: Validar aplicativo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (alerta)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      CI: true
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Preparar Node 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar lint e apontar código que merece limpeza
        run: npm run lint

  qualidade:
    name: Qualidade e regressões
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Preparar Node 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Rodar testes automatizados
        run: npm test
      - name: Validar build de produção
        run: npm run build

  carga:
    name: Teste de carga local
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Preparar Node 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Simular múltiplas barbearias e usuários
        run: npm run test:load
